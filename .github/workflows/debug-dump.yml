name: Debug dump (temporary)

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL"
        required: true
        type: string
      max_configs:
        description: "max configs"
        required: false
        default: "25"
        type: string

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Real-TunnelBench
        uses: ./
        with:
          source_url: ${{ inputs.source_url }}
          output_dir: output
          max_configs: ${{ inputs.max_configs }}
          timeout_minutes: "12"
          iran_probe: "on"

      - name: Commit the results back to the branch
        run: |
          mkdir -p debug-output
          cp output/working_configs.txt output/working_configs_plain.txt output/configs_ranked.csv output/results.json output/summary.md output/report.pdf debug-output/ 2>/dev/null || true
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add debug-output
          git commit -m "debug output" || true
          git push origin HEAD:${{ github.head_ref }}
