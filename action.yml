
name: "Real-TunnelBench Static Analyzer"
description: "Analyze configuration text structure and generate TXT and PDF reports."

inputs:
  source_url:
    description: "Public HTTP(S) URL of a text file"
    required: true
  output_dir:
    description: "Directory for generated files"
    required: false
    default: "output"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      shell: bash
      run: python -m pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Run static analysis
      shell: bash
      env:
        SOURCE_URL: ${{ inputs.source_url }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
      run: |
        python "${{ github.action_path }}/src/analyzer.py" \
          --url "$SOURCE_URL" \
          --output-dir "$OUTPUT_DIR"
