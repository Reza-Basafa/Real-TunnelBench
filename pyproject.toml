[project]
name = "real-tunnelbench"
version = "2.0.0"
description = "Live benchmark of proxy configuration lists with an Iran-focused ranking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["reportlab>=4.0,<6"]

[project.scripts]
tunnelbench = "tunnelbench.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
